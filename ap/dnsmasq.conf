# dnsmasq.conf — DHCP + DNS for the isolated Newton subnet, wlan0 only.
# Run as its own instance via apply.sh (the system dnsmasq.service stays
# inactive and untouched). By default dnsmasq advertises itself (10.42.0.1)
# as both DNS server and router; forwarding is blocked by nftables anyway.

interface=wlan0
bind-interfaces
listen-address=10.42.0.1

dhcp-range=10.42.0.10,10.42.0.50,255.255.255.0,12h
dhcp-authoritative
log-dhcp

# Upstream DNS comes from /etc/resolv.conf (systemd-resolved stub) — default.
# Runtime state lives in a private dir created by apply.sh.
pid-file=/run/newton-ap/dnsmasq.pid
dhcp-leasefile=/run/newton-ap/dnsmasq.leases

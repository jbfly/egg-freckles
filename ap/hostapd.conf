# hostapd.conf — dedicated AP for the Newton MP2000 (WaveLAN, 802.11b, open).
# wlan0 is an Intel iwlwifi card; AP mode verified in `iw list`.
# Run via apply.sh, never as a system service.

interface=wlan0
driver=nl80211

ssid=newton
# Regulatory domain as reported by `iw reg get` on this machine (ETSI).
country_code=PT
ieee80211d=1

# 802.11b only: the WaveLAN card is a true b radio, this guarantees
# compatibility and 11 Mb/s is far more than the Newton can use.
hw_mode=b
channel=6
# WaveLAN needs 1/2 Mb/s basic rates (b-mode defaults, stated explicitly).
supported_rates=10 20 55 110
basic_rates=10 20 55 110

# Open network — no encryption.
auth_algs=1
wpa=0
ignore_broadcast_ssid=0

# Control socket so apply/verify can use hostapd_cli without extra privileges.
ctrl_interface=/run/newton-ap/hostapd
ctrl_interface_group=0

# WEP note: this distro ships hostapd 2.11, which removed WEP support entirely
# (wep_* keys are rejected as unknown config items). Open is the only option
# with the packaged build — acceptable: the Noguchi WaveLAN driver does open
# auth, and the subnet is firewalled to host TCP 6801 + DHCP/DNS only.

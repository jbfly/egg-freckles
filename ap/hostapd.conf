# hostapd.conf — dedicated AP for the Newton MP2000 (WaveLAN, 802.11b, open).
# wlan0 is an Intel iwlwifi card; AP mode verified in `iw list`.
# Run via apply.sh, never as a system service.

interface=wlan0
driver=nl80211

ssid=newton
# The AX200 is a SELF-MANAGED regdomain card: `iw reg get` shows the global
# domain as PT but phy#N (self-managed) as US, and the card obeys its own.
# Declaring PT here was a mismatch. US is what the radio actually enforces,
# and channel 6 is legal in both.
country_code=US
# ieee80211d advertises the country IE; with a self-managed card it just adds
# another chance for the channel setup to disagree. The Newton ignores it.
#ieee80211d=1

# 2026-07-25: hw_mode=b crashed the AX200 firmware repeatedly under AP mode
# ("PHY ctxt cmd error ret=-5", "Device error - SW reset", 7 resets in one
# boot). Each reset re-enumerated the card and dropped the Newton mid-DHCP.
# 802.11g is backward-compatible on 2.4 GHz, so the WaveLAN still associates
# at 1/2 Mb/s; b-only was caution, never a requirement.
hw_mode=g
channel=6
# Explicit b-era rates are what the firmware choked on. Leaving these unset
# lets g defaults advertise 1/2/5.5/11 anyway, which is what the WaveLAN needs.
#supported_rates=10 20 55 110
#basic_rates=10 20 55 110

# Open network — no encryption.
auth_algs=1
wpa=0
ignore_broadcast_ssid=0

# Control socket so apply/verify can use hostapd_cli without extra privileges.
ctrl_interface=/run/newton-ap/hostapd
ctrl_interface_group=0

# WEP note: this distro ships hostapd 2.11, which removed WEP support entirely
# (wep_* keys are rejected as unknown config items). Open is the only option
# with the packaged build — acceptable: the Noguchi WaveLAN driver does open
# auth, and the subnet is firewalled to host TCP 6801 + DHCP/DNS only.
